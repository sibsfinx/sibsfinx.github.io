# Free-plan posture (Netlify credit-based Free):
# - 300 credits/month HARD LIMIT — sites pause when exhausted; Free does NOT auto-recharge
#   and does NOT bill overages. Stay on Free; on Personal/Pro keep auto-recharge OFF.
# - This config uses only Free-safe features: static publish + one Edge Function for
#   HTML Accept negotiation. No Netlify Functions, Blobs, DB, AI Gateway, Image CDN,
#   Forms paid addons, or Background Functions.
# - Production deploys cost ~15 credits each; Deploy Previews / branch deploys are 0.
# - Bandwidth ~20 credits/GB; web requests (incl. Edge invocations) ~2 credits/10k.
# - Edge does NOT count as compute GB-hour. Profile photo is served from /images on Netlify.
# - Build is zero-dep Node (stdlib only); skip npm/pnpm install so Netlify does not
#   pull package.json's heavy devDependencies.

[build]
  # Stdlib-only prepare script — no node_modules required.
  command = "node scripts/prepare-netlify.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Avoid installing pnpm/node_modules from package.json (heavy scrapers/tsc unused here).
  NETLIFY_SKIP_DEPENDENCY_INSTALL = "true"

# Markdown negotiation only on HTML document routes (not static assets).
[[edge_functions]]
  function = "negotiate"
  path = "/*"
  excludedPath = [
    "/css/*",
    "/js/*",
    "/images/*",
    "/fonts/*",
    "/*.css",
    "/*.js",
    "/*.mjs",
    "/*.map",
    "/*.md",
    "/*.txt",
    "/*.xml",
    "/*.json",
    "/*.pdf",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.webp",
    "/*.gif",
    "/*.svg",
    "/*.avif",
    "/*.ico",
    "/*.woff",
    "/*.woff2",
    "/*.ttf",
    "/*.otf",
    "/*.eot",
    "/*.mp4",
    "/*.webm",
    "/*.mp3",
    "/*.wav",
    "/*.ogg",
    "/*.zip"
  ]

# Pretty folder indexes already use about/index.html etc.
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/work"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/AGENTS.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"


# Never serve private agent/memory rules.
[[redirects]]
  from = "/.ai"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.ai/*"
  to = "/404.html"
  status = 404
  force = true

# Explicit SPA-safe 404 (status must be 404, not 200).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/"
  [headers.values]
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/*.html"
  [headers.values]
    Vary = "Accept, Accept-Encoding"
