[build]
  command = "node scripts/prepare-netlify.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

# Markdown negotiation + agent-friendly 404s (Accept: text/markdown)
[[edge_functions]]
  function = "negotiate"
  path = "/*"
  excludedPath = [
    "/css/*",
    "/js/*",
    "/images/*",
    "/*.pdf",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.gif",
    "/*.svg",
    "/*.ico",
    "/*.woff",
    "/*.woff2"
  ]

# Pretty folder indexes already use about/index.html etc.
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/work"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/AGENTS.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
