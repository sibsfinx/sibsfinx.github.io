[[edge_functions]]
function = "negotiate"
path = "/*"

[build]
publish = "."
command = "echo 'static site'"

[[headers]]
for = "/*.md"
  [headers.values]
  Content-Type = "text/markdown; charset=utf-8"
  Vary = "Accept, Accept-Encoding"

[[headers]]
for = "/llms.txt"
  [headers.values]
  Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/llms-full.txt"
  [headers.values]
  Content-Type = "text/plain; charset=utf-8"
